# BugHunt configuration.
# Every external analyzer is optional. BugHunt reports tools it could not run
# instead of treating "not installed" as "clean".

[project]
python_paths = ["src", "tests"]
source_paths = ["src"]
test_paths = ["tests"]

[execution]
max_parallel = 6
fail_on = "findings"       # findings | error | never
raw_output_limit_kb = 512

[timeouts]
fast = 120
pr = 900
deep = 7200
all = 14400

[profiles.fast]
tools = [
  "compile",
  "ruff",
  "basedpyright",
  "mypy",
  "ty",
  "pyrefly",
]

