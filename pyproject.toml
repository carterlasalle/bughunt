[project]
# trace:v1 id=ops.name work=WORK-BUG-4ABH9VEY satisfies=REQ-BUG-KZG483AX
name = "bughunt"
# trace:v1 id=ops.version work=WORK-BUG-06107X2Q satisfies=REQ-BUG-5XJWASR4
version = "0.8.0"
description = "Defense-in-depth bug finding orchestrator for Python repositories"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0.3",
    "rich>=14.0",
    "typing-extensions>=4.16.0",
]
# trace:exempt reason=packaging-metadata-no-product-behavior
license = "MIT"
# trace:exempt reason=packaging-metadata-no-product-behavior
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
# trace:exempt reason=packaging-metadata-no-product-behavior
Homepage = "https://github.com/carterlasalle/bughunt"
# trace:exempt reason=packaging-metadata-no-product-behavior
Repository = "https://github.com/carterlasalle/bughunt"
# trace:exempt reason=packaging-metadata-no-product-behavior
Issues = "https://github.com/carterlasalle/bughunt/issues"
# trace:exempt reason=packaging-metadata-no-product-behavior
Changelog = "https://github.com/carterlasalle/bughunt/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff",
    "basedpyright",
    "mypy",
    "ty",
    "pyrefly",
    "pylint",
    "vulture",
    "bandit",
    "deptry",
    "import-linter",
    "ast-grep-cli",
    "semgrep",
    "deal[all]",
    "crosshair-tool",
    "hypothesis[cli]",
    "mutmut",
    "schemathesis",
    "radon",
    "lizard",
    "complexipy",
    "coverage",
    "typeguard",
    "pytest-randomly",
    "pytest-timeout",
    "pytest-socket",
    "pytest-xdist",
    "pytest-run-parallel",
    "blockbuster>=1.5,<1.6",
    "hypofuzz",
    "nox",
    "griffe",
    "pydoclint",
    "validate-pyproject[all]",
    "twine",
    "check-manifest",
    "pytest-benchmark",
    "pytest-memray",
    "pyanalyze",
    "refurb",
    "xdoctest",
    "check-jsonschema",
    "time-machine",
    "freezegun",
    "vcrpy",
    "pact-python",
    "py-spy",
    "uvicorn",
]

[project.scripts]
bughunt = "bughunt.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bughunt"]

[tool.hatch.build]
# trace:v1 id=ops.build-artifacts work=WORK-BUG-06107X2Q satisfies=REQ-BUG-5XJWASR4
artifacts = ["src/bughunt/py.typed"]
# trace:v1 id=ops.sdist-excludes work=WORK-BUG-06107X2Q satisfies=REQ-BUG-5XJWASR4
[tool.hatch.build.targets.sdist]
# Mirrors MANIFEST.in prunes: hatchling does not read MANIFEST.in, and
# check-manifest does not read hatch excludes. Both state the same boundary.
# trace:v1 id=ops.sdist-exclude-list work=WORK-BUG-06107X2Q satisfies=REQ-BUG-5XJWASR4
exclude = [
  ".agents",
  ".claude",
  ".codex",
  ".omp",
  ".hermes",
  ".pi",
  ".trace",
  ".bughunt",
  ".complexipy_cache",
  ".import_linter_cache",
  "skills-lock.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

# BEGIN BUGHUNT MANAGED MUTMUT CONFIG
[tool.mutmut]
source_paths = ["src/"]
pytest_add_cli_args_test_selection = ["tests/"]
# Coverage gaps are reported separately as BHCOV001/BHCOV002. Restrict mutation
# to covered lines by default so mutation testing measures assertion strength
# instead of spending most of its budget on code the suite never executes.
mutate_only_covered_lines = true
# END BUGHUNT MANAGED MUTMUT CONFIG

[tool.ruff]
# trace:exempt reason=tool-config-no-product-behavior
target-version = "py311" # matches requires-python floor; keeps 3.12-only syntax flagged
# Subprocess auditing rides the default gate (not just PARANOID): every
# subprocess call carries an audited noqa or a fixed vector. RUF100 would
# otherwise flag the PARANOID-serving noqas as unused under this config.
# trace:v1 id=ops.ruff-select work=WORK-BUG-06107X2Q satisfies=REQ-BUG-5XJWASR4
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "S603", "S607"]

[tool.ruff.lint.per-file-ignores]
# Test git invocations mirror the PARANOID preset's tests/** S607 scope.
# trace:v1 id=ops.ruff-per-file-ignores work=WORK-BUG-06107X2Q satisfies=REQ-BUG-5XJWASR4
"tests/**" = ["S607"]

[tool.mypy]
# trace:exempt reason=tool-config-no-product-behavior
python_version = "3.12"
# trace:exempt reason=tool-config-no-product-behavior
warn_unused_configs = true
# trace:exempt reason=tool-config-no-product-behavior
ignore_missing_imports = true

[tool.coverage.run]
# trace:exempt reason=tool-config-no-product-behavior
source = ["src"]
# trace:exempt reason=tool-config-no-product-behavior
branch = true

[tool.coverage.report]
# trace:exempt reason=tool-config-no-product-behavior
show_missing = true
# Entry-point trampolines only: `if __name__ == "__main__"` blocks contain no
# product logic (main() itself is tested). This is coverage.py's canonical
# exclusion example, not a gap being hidden.
# trace:v1 id=ops.coverage-main-exclude work=WORK-BUG-06107X2Q satisfies=REQ-BUG-5XJWASR4
exclude_lines = ["if __name__ == ['\"]__main__['\"]:"]

# trace:v1 id=ops.refurb-disable work=WORK-BUG-06107X2Q satisfies=REQ-BUG-5XJWASR4
[tool.refurb]
# Micro-style modernizations with zero bug value (tuple-vs-list membership,
# ==-chains, Path(), f-string-vs-str): churn, not correctness. Codes with
# type assumptions or structural value (FURB123/143/107/113/138/...) stay on.
# trace:v1 id=ops.refurb-disable-list work=WORK-BUG-06107X2Q satisfies=REQ-BUG-5XJWASR4
disable = [
  "FURB109",
  "FURB108",
  "FURB171",
  "FURB124",
  "FURB153",
  "FURB183",
  "FURB110",
]

# trace:v1 id=ops.deptry-optional-probes work=WORK-BUG-06107X2Q satisfies=REQ-BUG-5XJWASR4
[tool.deptry.per_rule_ignores]
# pylint/pact are optional engine probes with ImportError fallbacks;
# deptry cannot model optionality. Tradeoff: future undeclared uses of
# these two packages also silence; everything else still reports.
# trace:v1 id=ops.deptry-per-rule-ignores work=WORK-BUG-06107X2Q satisfies=REQ-BUG-5XJWASR4
DEP004 = ["pylint", "pact"]
