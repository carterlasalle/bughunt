[project]
# trace:v1 id=ops.name work=WORK-BUG-4ABH9VEY satisfies=REQ-BUG-KZG483AX
name = "bughunt"
version = "0.6.0"
description = "Defense-in-depth bug finding orchestrator for Python repositories"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "rich>=14.0",
]
# trace:exempt reason=repo-scaffolding-no-product-behavior
license = "MIT"
# trace:exempt reason=repo-scaffolding-no-product-behavior
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
# trace:exempt reason=repo-scaffolding-no-product-behavior
Homepage = "https://github.com/carterlasalle/bughunt"
# trace:exempt reason=repo-scaffolding-no-product-behavior
Repository = "https://github.com/carterlasalle/bughunt"
# trace:exempt reason=repo-scaffolding-no-product-behavior
Issues = "https://github.com/carterlasalle/bughunt/issues"
# trace:exempt reason=repo-scaffolding-no-product-behavior
Changelog = "https://github.com/carterlasalle/bughunt/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff",
    "basedpyright",
    "mypy",
    "ty",
    "pyrefly",
    "pylint",
    "vulture",
    "bandit",
    "deptry",
    "import-linter",
    "ast-grep-cli",
    "semgrep",
    "deal[all]",
    "crosshair-tool",
    "hypothesis[cli]",
    "mutmut",
    "schemathesis",
    "radon",
    "lizard",
    "complexipy",
    "coverage",
    "typeguard",
    "pytest-randomly",
    "pytest-timeout",
    "pytest-socket",
    "pytest-xdist",
    "pytest-run-parallel",
    "blockbuster>=1.5,<1.6",
    "hypofuzz",
    "nox",
    "griffe",
    "pydoclint",
    "validate-pyproject[all]",
    "twine",
    "check-manifest",
    "pytest-benchmark",
    "pytest-memray",
    "pyanalyze",
    "refurb",
    "xdoctest",
    "check-jsonschema",
    "time-machine",
    "freezegun",
    "vcrpy",
    "pact-python",
    "py-spy",
    "uvicorn",
]

[project.scripts]
bughunt = "bughunt.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bughunt"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# BEGIN BUGHUNT MANAGED MUTMUT CONFIG
[tool.mutmut]
source_paths = ["src/"]
pytest_add_cli_args_test_selection = ["tests/"]
# Coverage gaps are reported separately as BHCOV001/BHCOV002. Restrict mutation
# to covered lines by default so mutation testing measures assertion strength
# instead of spending most of its budget on code the suite never executes.
mutate_only_covered_lines = true
# END BUGHUNT MANAGED MUTMUT CONFIG

[tool.ruff]
# trace:exempt reason=repo-scaffolding-no-product-behavior
target-version = "py311" # matches requires-python floor; keeps 3.12-only syntax flagged

[tool.mypy]
# trace:exempt reason=repo-scaffolding-no-product-behavior
python_version = "3.12"
# trace:exempt reason=repo-scaffolding-no-product-behavior
warn_unused_configs = true
# trace:exempt reason=repo-scaffolding-no-product-behavior
ignore_missing_imports = true

[tool.coverage.run]
# trace:exempt reason=repo-scaffolding-no-product-behavior
source = ["src"]
# trace:exempt reason=repo-scaffolding-no-product-behavior
branch = true

[tool.coverage.report]
# trace:exempt reason=repo-scaffolding-no-product-behavior
show_missing = true
